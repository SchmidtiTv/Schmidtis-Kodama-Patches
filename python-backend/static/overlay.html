<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;700&family=Roboto:wght@400;700&family=Nunito:wght@400;700&family=Exo+2:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Montserrat:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Ubuntu:wght@400;700&family=Lexend:wght@400;700&family=Space+Grotesk:wght@400;700&family=Sora:wght@400;700&family=Barlow:wght@400;700&family=Figtree:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Kanit:wght@400;700&family=Oxanium:wght@400;700&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The three colours of the current cover (0..255 per channel), set by applyCoverPal. Registered
   so they can be animated: a new song's colours glide in instead of switching. */
@property --cv1r{syntax:'<number>';inherits:true;initial-value:238}
@property --cv1g{syntax:'<number>';inherits:true;initial-value:168}
@property --cv1b{syntax:'<number>';inherits:true;initial-value:255}
@property --cv2r{syntax:'<number>';inherits:true;initial-value:124}
@property --cv2g{syntax:'<number>';inherits:true;initial-value:77}
@property --cv2b{syntax:'<number>';inherits:true;initial-value:255}
@property --cv3r{syntax:'<number>';inherits:true;initial-value:0}
@property --cv3g{syntax:'<number>';inherits:true;initial-value:229}
@property --cv3b{syntax:'<number>';inherits:true;initial-value:255}
:root{transition:--cv1r 1.2s ease,--cv1g 1.2s ease,--cv1b 1.2s ease,--cv2r 1.2s ease,--cv2g 1.2s ease,--cv2b 1.2s ease,--cv3r 1.2s ease,--cv3g 1.2s ease,--cv3b 1.2s ease}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-width:100vw}
#stage{position:relative;flex-shrink:0;transition:filter .3s,opacity .4s}
#border,#bg,#blur,#layers,#layers-free{position:absolute;inset:0}
#border,#bg,#blur{pointer-events:none}
#bg{transition:background .3s}
#blur{background-size:cover;background-position:center;opacity:0;transition:opacity .3s}
.layer{position:absolute}
.layer-anim{position:absolute;inset:0}
.layer-group{position:absolute;inset:0}
@keyframes ovl-fade{from{opacity:0}to{opacity:1}}
@keyframes ovl-slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes ovl-slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes ovl-slideLeft{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ovl-slideRight{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ovl-zoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes ovl-blurIn{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes ovl-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.1)}80%{transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes ovl-zoomOut{from{opacity:0;transform:scale(1.3)}to{opacity:1;transform:scale(1)}}
@keyframes ovl-flipX{from{opacity:0;transform:perspective(500px) rotateX(-80deg)}to{opacity:1;transform:perspective(500px) rotateX(0)}}
@keyframes ovl-flipY{from{opacity:0;transform:perspective(500px) rotateY(80deg)}to{opacity:1;transform:perspective(500px) rotateY(0)}}
@keyframes ovl-rotateIn{from{opacity:0;transform:rotate(-25deg) scale(.85)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes ovl-dropIn{0%{opacity:0;transform:translateY(-48px)}55%{opacity:1;transform:translateY(8px)}75%{transform:translateY(-4px)}90%{transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
@keyframes ovl-wipeRight{from{clip-path:inset(-60% 100% -60% -60%)}to{clip-path:inset(-60% -60% -60% -60%)}}
@keyframes ovl-wipeLeft{from{clip-path:inset(-60% -60% -60% 100%)}to{clip-path:inset(-60% -60% -60% -60%)}}
@keyframes ovl-enter{from{transform:translate(var(--ovl-dx,0px),var(--ovl-dy,0px))}to{transform:translate(0,0)}}
@keyframes ovl-wipeUp{from{clip-path:inset(100% -60% -60% -60%)}to{clip-path:inset(-60% -60% -60% -60%)}}
@keyframes ovl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ovl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ovl-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.layer-img{width:100%;height:100%;display:block}
.layer-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.txt{display:flex;width:100%;height:100%}
.txt-inner{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.txt-inner.scroll{text-overflow:clip}
.txt-inner.scroll span{display:inline-block}
.prog-track,.prog-fill{position:absolute;top:0;height:100%}
.prog-track{left:0;right:0}
.prog-fill{left:0;width:0}
.prog-fx{position:absolute;top:0;bottom:0;pointer-events:none}
@keyframes ovl-cane{from{background-position:0 0}to{background-position:16px 0}}
@keyframes ovl-glint{0%,60%{left:-35%}100%{left:110%}}
@keyframes ovl-comet{from{left:-35%}to{left:100%}}
@keyframes ovl-breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes ovl-hue{to{filter:hue-rotate(360deg)}}
</style></head>
<body>
<div id="stage"><div id="border"></div><div id="bg"></div><div id="blur"></div><div id="layers"></div><div id="layers-free"></div></div>
<script>
const API=location.origin;
const EDITOR=new URLSearchParams(location.search).get('editor')==='1'; // suppress entrance anims in the editor preview
// Still mode: a thumbnail of one saved design. It takes its document only from postMessage,
// so it must NOT subscribe to the live stream or pull the active config — a dozen thumbnails
// would otherwise open a dozen SSE clients and then overwrite themselves with the doc that is
// currently on air. Sample track data stands in so text layers are not blank.
const STILL=new URLSearchParams(location.search).get('still')==='1';
let doc=null;
const state={title:"",artist:"",album:"",cover:"",progress:0,duration:0,isPlaying:false};
const layerEls={}; // id -> record

// Preview background via ?bg= (light | checkered | dark)
(()=>{const p=new URLSearchParams(location.search).get('bg');if(p)document.body.style.background=p==='light'?'#efefef':p==='checkered'?'repeating-conic-gradient(#aaa 0% 25%,#ddd 0% 50%) 0 0/20px 20px':'#111';})();

// A colour can point at the cover: "cover:N" (N = 1..3, by how much of the cover it fills),
// optionally ":light" or ":dark". It resolves to the CSS variables above, so everything drawn
// with it changes with the song without being rebuilt. The editor mixes the same way
// (src/features/overlay/cover-colors.js), keep the two in step.
function coverChannels(c){
  const m=/^cover:([123])(?::(light|dark))?$/.exec(c);if(!m)return null;
  const v=(ch)=>`var(--cv${m[1]}${ch})`;
  const f=m[2]==='light'?(ch)=>`calc(${v(ch)} + (255 - ${v(ch)}) * .55)`:m[2]==='dark'?(ch)=>`calc(${v(ch)} * .42)`:v;
  return [f('r'),f('g'),f('b')];
}
function svgCol(el,attr,v){
  if(typeof v==='string'&&v.indexOf('var(')>=0){el.removeAttribute(attr);el.style.setProperty(attr,v);}
  else{el.style.removeProperty(attr);el.setAttribute(attr,v);}
}
function rgba(c,a){
  if(typeof c!=='string')return c;
  if(c.slice(0,6)==='cover:'){const k=coverChannels(c);return k?`rgba(${k.join(',')},${a==null?1:a})`:'transparent';}
  if(c[0]!=='#')return c;            // already rgba()/named — pass through
  const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  return a==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a})`;
}

function cornerPath(W,H,c,ox,oy){ox=ox||0;oy=oy||0;c=c||{};
  const tl={t:c.typeTL||'r',s:c.TL||0},tr={t:c.typeTR||'r',s:c.TR||0},
        br={t:c.typeBR||'r',s:c.BR||0},bl={t:c.typeBL||'r',s:c.BL||0};
  let d=`M ${ox+tl.s} ${oy} `;
  if(tr.t==='r')d+=`L ${ox+W-tr.s} ${oy} Q ${ox+W} ${oy} ${ox+W} ${oy+tr.s} `;else d+=`L ${ox+W-tr.s} ${oy} L ${ox+W} ${oy+tr.s} `;
  if(br.t==='r')d+=`L ${ox+W} ${oy+H-br.s} Q ${ox+W} ${oy+H} ${ox+W-br.s} ${oy+H} `;else d+=`L ${ox+W} ${oy+H-br.s} L ${ox+W-br.s} ${oy+H} `;
  if(bl.t==='r')d+=`L ${ox+bl.s} ${oy+H} Q ${ox} ${oy+H} ${ox} ${oy+H-bl.s} `;else d+=`L ${ox+bl.s} ${oy+H} L ${ox} ${oy+H-bl.s} `;
  if(tl.t==='r')d+=`L ${ox} ${oy+tl.s} Q ${ox} ${oy} ${ox+tl.s} ${oy} Z`;else d+=`L ${ox} ${oy+tl.s} L ${ox+tl.s} ${oy} Z`;
  return d.trim();
}

function applyCanvas(cv){
  cv=cv||{};
  const W=cv.width||400,H=cv.height||80;
  const stage=document.getElementById('stage'),border=document.getElementById('border'),
        bg=document.getElementById('bg'),blur=document.getElementById('blur'),layers=document.getElementById('layers');
  stage.style.width=W+'px';stage.style.height=H+'px';
  // Shadow + border glow render on #stage (no clip-path here so they spill outside the shape)
  const sh=cv.shadow&&cv.shadow.on?`drop-shadow(0 8px 32px rgba(0,0,0,${cv.shadow.strength==null?0.35:cv.shadow.strength}))`:'';
  const bd=cv.border||{};
  const glow=bd.on&&(bd.glow||0)>0?`drop-shadow(0 0 ${(bd.glow||0)*1.5}px ${rgba(bd.color||'#EEA8FF')})`:'';
  stage.style.filter=[sh,glow].filter(Boolean).join(' ')||'none';
  const bw=bd.on?(bd.width||1.5):0;
  const corners=cv.corners||{TL:14,TR:14,BR:14,BL:14,typeTL:'r',typeTR:'r',typeBR:'r',typeBL:'r'};
  const outer=cornerPath(W,H,corners,0,0);
  if(bw>0){
    const bi=2-Math.sqrt(2);
    const shrink=(t,r)=>Math.max(0,r-bw*(t==='b'?bi:1));
    const inner={TL:shrink(corners.typeTL,corners.TL),TR:shrink(corners.typeTR,corners.TR),
                 BR:shrink(corners.typeBR,corners.BR),BL:shrink(corners.typeBL,corners.BL),
                 typeTL:corners.typeTL,typeTR:corners.typeTR,typeBR:corners.typeBR,typeBL:corners.typeBL};
    const IW=Math.max(1,W-2*bw),IH=Math.max(1,H-2*bw);
    const innerAt=cornerPath(IW,IH,inner,bw,bw);
    border.style.display='';border.style.background=rgba(bd.color||'#EEA8FF');
    border.style.clipPath=`path(evenodd,'${outer} ${innerAt}')`;
    const clip=`path('${innerAt}')`;bg.style.clipPath=clip;blur.style.clipPath=clip;layers.style.clipPath=clip;
  }else{
    border.style.display='none';
    const clip=`path('${outer}')`;bg.style.clipPath=clip;blur.style.clipPath=clip;layers.style.clipPath=clip;
  }
  const b=cv.bg||{};
  bg.style.background=isGrad(b)?paintCss({...b,opacity:(b.opacity==null?90:b.opacity)}):rgba(b.color||'#1a1a1a',(b.opacity==null?90:b.opacity)/100);
  if(b.blurFromCover&&(b.blur||0)>0){
    blur.style.filter=`blur(${b.blur}px)`;blur.style.opacity=state.cover?'1':'0';
    if(state.cover)blur.style.backgroundImage=`url(${state.cover})`;
  }else{blur.style.opacity='0';blur.style.filter='none';}
}

function buildAlbumArt(el,L,rec){
  const s=L.style||{};
  const ph=document.createElement('div');ph.className='layer-ph';ph.style.background=rgba(s.placeholderBg||'rgba(255,255,255,.12)');
  ph.innerHTML='<svg width="38%" height="38%" viewBox="0 0 24 24" fill="rgba(255,255,255,.4)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>';
  const img=document.createElement('img');img.className='layer-img';img.style.display='none';img.style.objectFit=s.fit||'cover';
  const cp=`path('${cornerPath(L.w||0,L.h||0,s.corners,0,0)}')`;ph.style.clipPath=cp;img.style.clipPath=cp;
  el.appendChild(ph);el.appendChild(img);rec.img=img;rec.ph=ph;
}

function buildText(el,L,rec){
  const s=L.style||{};
  const box=document.createElement('div');box.className='txt';
  box.style.alignItems=s.valign==='middle'?'center':s.valign==='bottom'?'flex-end':'flex-start';
  box.style.justifyContent=s.align==='center'?'center':s.align==='right'?'flex-end':'flex-start';
  const inner=document.createElement('div');inner.className='txt-inner';
  inner.style.fontFamily=s.fontFamily||'system-ui,sans-serif';
  inner.style.fontSize=(s.fontSize||14)+'px';
  inner.style.fontWeight=s.fontWeight||400;
  inner.style.color=topFillColor(s,s.color||'#fff');
  const tfill=visFills(s)[0];
  if(isGrad(tfill)){
    // A marquee moves the span inside the line. Clipped to text on the line, the gradient's mask
    // stayed where the text was before it moved, and the title showed up shifted and cut. So a
    // moving text carries its own gradient (set on the span below).
    if(s.marquee){rec.spanPaint=paintCss(tfill);inner.style.color='transparent';}
    else{inner.style.backgroundImage=paintCss(tfill);inner.style.webkitBackgroundClip='text';inner.style.backgroundClip='text';inner.style.color='transparent';}
  }
  // Outline: the first visible stroke. "Outside" is a stroke twice as wide painted UNDER the
  // fill, so only its outer half shows; text has no inside stroke to offer.
  //
  // The browser's own text stroke can only do sharp (miter) corners, which spike on digits and
  // diagonals, and cannot take a gradient. So a single line with an outline is drawn as SVG
  // text, glyphs and outline both, with the corner style and paints of the layer; the HTML text
  // stays underneath, invisible, for the layout, the marquee and the ellipsis. Several lines
  // cannot be SVG text (it does not wrap) and keep the browser's stroke.
  const tst=(Array.isArray(s.strokes)?s.strokes:[]).find(p=>p&&p.visible!==false);
  let reach=0;
  const multi=(s.maxLines||1)>1;
  if(tst){
    const w=(s.strokeWeight==null?2:s.strokeWeight),out=(s.strokePosition||'outside')!=='center';
    reach=out?w:w/2;
    if(multi){
      inner.style.webkitTextStroke=(out?w*2:w)+'px '+rgba(tst.color||'#000000',(tst.opacity==null?100:tst.opacity)/100);
      inner.style.paintOrder=out?'stroke fill':'normal';
    }else{
      rec.outline={w,out,stroke:tst,fill:tfill||{color:Array.isArray(s.fills)?'transparent':(s.color||'#ffffff'),opacity:100},join:s.strokeJoin||'round'};
      inner.style.color='transparent';inner.style.backgroundImage='';
    }
  }
  // The line clips its content (for the ellipsis and the marquee), and that clipped the outline
  // and any glyph reaching past the line box: tall caps, descenders, overhanging letters. Room
  // inside the clip, given back as negative margin, keeps the text exactly where it was.
  const px=Math.ceil(reach)+2,py=`calc(0.25em + ${Math.ceil(reach)}px)`;
  inner.style.padding=`${py} ${px}px`;
  inner.style.margin=`calc(-0.25em - ${Math.ceil(reach)}px) -${px}px`;
  inner.style.maxWidth=`calc(100% + ${2*px}px)`;
  inner.style.textAlign=s.align||'left';
  inner.style.letterSpacing=(s.letterSpacing||0)+'px';
  inner.style.lineHeight=s.lineHeight||1.3;
  if((s.maxLines||1)>1){inner.style.whiteSpace='normal';inner.style.display='-webkit-box';inner.style.webkitBoxOrient='vertical';inner.style.webkitLineClamp=s.maxLines;}
  const span=document.createElement('span');const tn=document.createTextNode('');span.appendChild(tn);
  inner.appendChild(span);box.appendChild(inner);el.appendChild(box);
  rec.span=span;rec.inner=inner;rec.tnode=tn;rec.full=null;
  if(rec.spanPaint&&!rec.outline){span.style.backgroundImage=rec.spanPaint;span.style.webkitBackgroundClip='text';span.style.backgroundClip='text';span.style.color='transparent';}
  if(rec.outline){
    const ns='http://www.w3.org/2000/svg';
    span.style.position='relative';span.style.display='inline-block';
    const svg=document.createElementNS(ns,'svg');svg.style.cssText='position:absolute;left:0;top:0;overflow:visible;pointer-events:none';
    const t=document.createElementNS(ns,'text');t.setAttribute('x','0');
    t.style.fontFamily=inner.style.fontFamily;t.style.fontSize=inner.style.fontSize;t.style.fontWeight=inner.style.fontWeight;
    t.style.letterSpacing=(s.letterSpacing||0)+'px';t.style.whiteSpace='pre';
    svg.appendChild(t);span.appendChild(svg);rec.osvg=svg;rec.otext=t;
  }
}

function syncOutline(rec){
  const o=rec.outline;if(!o||!rec.osvg)return;
  const span=rec.span,svg=rec.osvg,t=rec.otext;
  const probe=document.createElement('i');probe.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  span.insertBefore(probe,svg);const base=probe.offsetTop;span.removeChild(probe);
  const W=Math.max(1,span.offsetWidth),H=Math.max(1,span.offsetHeight);
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  t.setAttribute('y',base);t.textContent=rec.tnode.data;
  const old=svg.querySelector('defs');if(old)svg.removeChild(old);
  svgCol(t,'fill',svgPaint(svg,o.fill,W,H,'#ffffff'));
  svgCol(t,'stroke',svgPaint(svg,o.stroke,W,H,'#000000'));
  t.setAttribute('stroke-width',o.out?o.w*2:o.w);
  t.setAttribute('stroke-linejoin',o.join==='bevel'?'bevel':o.join==='miter'?'miter':'round');
  t.setAttribute('stroke-linecap','round');
  t.setAttribute('paint-order',o.out?'stroke fill':'fill stroke');
}
// SVG text cannot end in an ellipsis on its own, so an outlined line is shortened here, the
// same way the browser would: as many characters as fit, then "…".
function fitOutlined(rec,full){
  // Measured on the text box (the layer's width): the line itself shrinks to its content, so
  // measuring it chased its own tail down to a lone ellipsis.
  const avail=rec.inner.parentElement.clientWidth;
  rec.tnode.data=full;
  if(rec.span.offsetWidth<=avail+0.5)return;
  let lo=0,hi=full.length;
  while(lo<hi){const mid=Math.ceil((lo+hi)/2);rec.tnode.data=full.slice(0,mid).trimEnd()+'\u2026';if(rec.span.offsetWidth<=avail+0.5)lo=mid;else hi=mid-1;}
  rec.tnode.data=full.slice(0,lo).trimEnd()+'\u2026';
}

const ovlDiv=(cls)=>{const d=document.createElement('div');if(cls)d.className=cls;return d;};
function progressFx(fill,s,fillCol){
  const fx=s.progressAnim||'none';
  if(fx==='cane'){
    // Over the fill rather than as its background, so a gradient fill shows through the stripes.
    fill.style.overflow='hidden';
    const c=ovlDiv('prog-fx');c.style.left='0';c.style.right='0';
    c.style.backgroundImage='linear-gradient(45deg,rgba(255,255,255,.45) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.45) 75%,transparent 75%,transparent)';
    c.style.backgroundSize='16px 16px';
    c.style.animation=`ovl-cane ${(s.progressAnimSpeed||1)*0.9}s linear infinite`;
    fill.appendChild(c);
  }else if(fx==='shimmer'||fx==='comet'){
    fill.style.overflow='hidden';
    const g=ovlDiv('prog-fx');g.style.width='35%';
    g.style.background=fx==='shimmer'
      ?'linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)'
      :'linear-gradient(90deg,transparent,rgba(255,255,255,.35) 60%,#fff)';
    g.style.animation=fx==='shimmer'?`ovl-glint ${(s.progressAnimSpeed||1)*2.4}s ease-in-out infinite`:`ovl-comet ${(s.progressAnimSpeed||1)*1.6}s linear infinite`;
    fill.appendChild(g);
  }else if(fx==='breathe'){
    fill.style.animation=`ovl-breathe ${(s.progressAnimSpeed||1)*2.2}s ease-in-out infinite`;
  }else if(fx==='rainbow'){
    fill.style.backgroundImage='linear-gradient(90deg,#ff5f6d,#ffc371,#7cff6b,#4fc3f7,#b388ff)';
    fill.style.animation=`ovl-hue ${(s.progressAnimSpeed||1)*4}s linear infinite`;
  }
}
function buildProgress(el,L,rec){
  const s=L.style||{},kind=s.progressStyle||'bar',W=L.w||0,H=L.h||0;
  const fillCol=rgba(s.fillColor||'#EEA8FF',(s.fillOpacity==null?100:s.fillOpacity)/100);
  const trackCol=rgba(s.trackColor||'rgba(255,255,255,.12)');
  // The fill as a paint: solid fillColor, or a gradient (fillType/fillStops/fillAngle).
  const fillPaint={type:s.fillType||'solid',color:s.fillColor||'#EEA8FF',opacity:(s.fillOpacity==null?100:s.fillOpacity),stops:s.fillStops,angle:s.fillAngle};
  const gradFill=isGrad(fillPaint)?paintCss(fillPaint):'';
  rec.kind=kind;
  if(kind==='segments'||kind==='dots'){
    const n=Math.max(2,Math.min(60,Math.round(s.segCount||(kind==='dots'?16:10))));
    const row=ovlDiv();row.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between';
    if(kind==='segments')row.style.gap=(s.segGap==null?4:s.segGap)+'px';
    const parts=[];
    const dot=Math.max(2,Math.min(H,s.dotSize||Math.round(H*0.5)));
    for(let i=0;i<n;i++){
      const seg=ovlDiv();
      if(kind==='segments'){seg.style.cssText=`flex:1;height:${H}px;border-radius:${H/2}px;background:${trackCol};position:relative;overflow:hidden`;}
      else{seg.style.cssText=`width:${dot}px;height:${dot}px;border-radius:50%;background:${trackCol};position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s`;}
      const f=ovlDiv();f.style.cssText=`position:absolute;left:0;top:0;bottom:0;width:0;background:${fillCol}`;
      if(gradFill&&kind==='segments'){f.style.background='';f.style.backgroundImage=gradFill;}

function loopAnim(lp){const dur=lp.speed||(lp.type==='spin'?4:2);return `ovl-${lp.type} ${dur}s ${lp.type==='spin'?'linear':'ease-in-out'} ${lp.delay||0}s infinite`;}

// Groups are marks on the layers (layer.group, doc.groups with parents). Most of them draw
// exactly as loose layers would; only a group that animates gets an element of its own, so that
// it moves, spins or pulses as ONE thing around its own centre. A wrapper is a stacking context
// and would change how blend modes inside it mix with what is below, which is why a group
// without animation gets none.
function groupPlan(dc){
  const gm={};(dc.groups||[]).forEach(g=>{gm[g.id]=g;});
  const on=a=>a&&a.type&&a.type!=='none';
  const animated=g=>!!(g&&g.fx&&(on(g.fx.entrance)||on(g.fx.loop)));
  const stagger=g=>!!(g&&g.fx&&on(g.fx.entrance)&&(g.fx.entrance.stagger||0)>0);
  const chain=L=>{const out=[],seen={};let id=L.group;while(id&&gm[id]&&!seen[id]){seen[id]=1;out.unshift(id);id=gm[id].parent;}return out;};
  const box={},top={};
  for(const L of dc.layers||[]){
    for(const gid of chain(L)){
      const b=box[gid]||(box[gid]={x1:1e9,y1:1e9,x2:-1e9,y2:-1e9});
      b.x1=Math.min(b.x1,L.x||0);b.y1=Math.min(b.y1,L.y||0);
      b.x2=Math.max(b.x2,(L.x||0)+(L.w||0));b.y2=Math.max(b.y2,(L.y||0)+(L.h||0));
      top[gid]=Math.max(top[gid]==null?-1e9:top[gid],L.z||0);
    }
  }
  // With a stagger, a group's direct children come in one after another, bottom first.
  const order={};
  for(const gid in gm){
    if(!stagger(gm[gid]))continue;
    const kids=[];
    (dc.layers||[]).forEach(L=>{if(L.group===gid)kids.push(['l:'+L.id,L.z||0]);});
    (dc.groups||[]).forEach(g=>{if(g.parent===gid&&top[g.id]!=null)kids.push(['g:'+g.id,top[g.id]]);});
    kids.sort((a,b)=>a[1]-b[1]);
    order[gid]={};kids.forEach((k,i)=>{order[gid][k[0]]=i;});
  }
  const wrapped=gid=>{const g=gm[gid];return animated(g)||!!(g&&g.parent&&stagger(gm[g.parent]));};
  return {gm,on,stagger,chain,box,top,order,wrapped};
}
function staggerAnim(plan,parentId,key){
  const p=plan.gm[parentId];
  if(!p||!plan.stagger(p)||(EDITOR&&!REPLAY))return '';
  const i=(plan.order[parentId]||{})[key]||0;
  return entrAnim(p.fx.entrance,i*p.fx.entrance.stagger);
}
function groupWrap(plan,container,gid){
  container._gw=container._gw||{};
  if(container._gw[gid])return container._gw[gid];
  const g=plan.gm[gid],b=plan.box[gid]||{x1:0,y1:0,x2:0,y2:0};
  const origin=((b.x1+b.x2)/2)+'px '+((b.y1+b.y2)/2)+'px';
  const outer=document.createElement('div');outer.className='layer-group';
  const entr=document.createElement('div');entr.className='layer-anim';
  const loopw=document.createElement('div');loopw.className='layer-anim';
  [outer,entr,loopw].forEach(d=>{d.style.transformOrigin=origin;});
  outer.style.zIndex=plan.top[gid]||0;
  outer.appendChild(entr);entr.appendChild(loopw);container.appendChild(outer);
  const gbox={x:b.x1,y:b.y1,w:b.x2-b.x1,h:b.y2-b.y1};
  if(g.parent){outer.style.animation=staggerAnim(plan,g.parent,'g:'+gid);enterVars(outer,(plan.gm[g.parent].fx||{}).entrance,gbox,0);}
  const fx=g.fx||{},en=fx.entrance,lp=fx.loop;
  if(plan.on(en)&&!plan.stagger(g)&&(!EDITOR||REPLAY)){entr.style.animation=entrAnim(en,0);enterVars(entr,en,gbox,0);}
  if(plan.on(lp))loopw.style.animation=loopAnim(lp);
  container._gw[gid]=loopw;
  return loopw;
}

function buildLayers(dc){
  const layers=document.getElementById('layers');layers.innerHTML='';layers._gw=null;
  const free=document.getElementById('layers-free');free.innerHTML='';free._gw=null;
  for(const k in layerEls)delete layerEls[k];
  const plan=groupPlan(dc);
  const sorted=(dc.layers||[]).slice().sort((a,b)=>(a.z||0)-(b.z||0));
  for(const L of sorted){
    const el=document.createElement('div');el.className='layer';
    el.style.left=(L.x||0)+'px';el.style.top=(L.y||0)+'px';
    el.style.width=(L.w||0)+'px';el.style.height=(L.h||0)+'px';
    el.style.zIndex=L.z||0;
    el.style.opacity=(L.opacity==null?100:L.opacity)/100;
    var tf='';
    if(L.rotation)tf+='rotate('+L.rotation+'deg) ';
    if(L.flipH||L.flipV)tf+='scale('+(L.flipH?-1:1)+','+(L.flipV?-1:1)+')';
    el.style.transform=tf.trim();
    el.style.mixBlendMode=(L.blend&&L.blend!=='normal')?L.blend:'';
    el.style.display=L.visible===false?'none':'';
    const entr=document.createElement('div');entr.className='layer-anim';
    const loopw=document.createElement('div');loopw.className='layer-anim';
    entr.appendChild(loopw);el.appendChild(entr);
    const rec={root:el,type:L.type,bind:L.bind,layer:L};
    (BUILDERS[L.type]||(()=>{}))(loopw,L,rec);
    applyFx(el,entr,loopw,L);
    let host=L.clip===false?free:layers;
    for(const gid of plan.chain(L).filter(plan.wrapped))host=groupWrap(plan,host,gid);
    // A layer whose group comes in staggered gets its turn on a wrapper of its own: on el the
    // keyframes' transform would replace the layer's rotation.
    const sa=L.group?staggerAnim(plan,L.group,'l:'+L.id):'';
    if(sa){
      const sw=document.createElement('div');sw.className='layer-anim';
      sw.style.zIndex=L.z||0;sw.style.transformOrigin=((L.x||0)+(L.w||0)/2)+'px '+((L.y||0)+(L.h||0)/2)+'px';
      sw.style.animation=sa;enterVars(sw,(plan.gm[L.group].fx||{}).entrance,{x:L.x||0,y:L.y||0,w:L.w||0,h:L.h||0},0);sw.appendChild(el);host.appendChild(sw);
    }else host.appendChild(el);
    layerEls[L.id]=rec;
  }
  // Shaders whose layer is gone (deleted, or no longer a shader) give their GL context back.
  for(const id in shaderCache)if(!layerEls[id]||!layerEls[id].shader)dropShader(id);
}

function textForBind(bind,style){
  style=style||{};
  if(bind==='title')return state.title||'No Music';
  if(bind==='artist')return state.artist||'';
  if(bind==='album')return state.album||'';
  if(bind==='position')return fmtTime(state.progress);
  if(bind==='duration')return fmtTime(state.duration);
  if(bind==='static')return style.content||'';
  if(bind==='subtitle'){
    const ps=style.parts||['artist'],parts=[];
    if(ps.indexOf('artist')>=0&&state.artist)parts.push(state.artist);
    if(ps.indexOf('album')>=0&&state.album)parts.push(state.album);
    return parts.join(' · ')||'Waiting...';
  }
  return style.content||'';
}
function fmtTime(s){if(!s||s<0||!isFinite(s))return'0:00';const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0');}

function applyMarquee(rec){
  const span=rec.span,inner=rec.inner,L=rec.layer,s=L.style||{};
  if(!s.marquee){span.classList.remove('scroll');if(rec.inner)rec.inner.classList.remove('scroll');span.style.animation='';return;}
  if(inner.classList.contains('scroll'))return;
  const overflow=inner.scrollWidth-inner.clientWidth;
  if(overflow>4){
    const speed=s.marqueeSpeed||80,scrollSec=Math.max(0.5,overflow/speed);
    const pauseStart=1,pauseEnd=5,total=pauseStart+scrollSec+pauseEnd;
    const p1=Math.round(pauseStart/total*1000)/10,p2=Math.round((pauseStart+scrollSec)/total*1000)/10;
    const name='kf_'+L.id.replace(/[^a-z0-9_]/gi,'');
    let kf=document.getElementById(name);
    if(!kf){kf=document.createElement('style');kf.id=name;document.head.appendChild(kf);}
    inner.classList.add('scroll');
    if((s.marqueeMode||'bounce')==='bounce'){
      // Back and forth: a short rest at each end and an eased glide between them, so the text
      // never jumps. The easing sits on the keyframes because each leg is its own movement.
      const hold=1.2,tot=hold+scrollSec+hold+scrollSec;
      const a=Math.round(hold/tot*1000)/10,b=Math.round((hold+scrollSec)/tot*1000)/10,c=Math.round((2*hold+scrollSec)/tot*1000)/10;
      const ez='animation-timing-function:ease-in-out';
      kf.textContent=`@keyframes ${name}{0%,${a}%{transform:translateX(0);${ez}}${b}%,${c}%{transform:translateX(${-overflow}px);${ez}}100%{transform:translateX(0)}}`;
      span.style.animation=`${name} ${tot.toFixed(1)}s linear infinite`;
    }else{
      kf.textContent=`@keyframes ${name}{0%,${p1}%{transform:translateX(0)}${p2}%,100%{transform:translateX(${-overflow}px)}}`;
      span.style.animation=`${name} ${total.toFixed(1)}s ease-in-out infinite`;
    }
  }
}

let stageShown=null,trackKey=null;
const ENTRANCE_KF=/^ovl-(fade|slide|zoom|blurIn|pop|flip|rotateIn|dropIn|wipe|enter)/;
function restartEntrances(){
  if(EDITOR)return;
  const els=[...document.querySelectorAll('#layers *, #layers-free *')].filter(el=>ENTRANCE_KF.test(el.style.animationName||''));
  const saved=els.map(el=>el.style.animation);
  els.forEach(el=>{el.style.animation='none';});
  void document.body.offsetWidth;
  els.forEach((el,i)=>{el.style.animation=saved[i];});
}
function applyAutoHide(){
  const stage=document.getElementById('stage');
  const show=!(doc&&doc.canvas&&doc.canvas.autoHide)||!!(state.isPlaying&&state.title);
  stage.style.opacity=show?'1':'0';
  if(show&&stageShown===false)restartEntrances();
  stageShown=show;
}

function renderData(){
  for(const id in layerEls){
    const rec=layerEls[id];
    if(rec.type==='albumArt'){
      const hqMode=(rec.layer.style||{}).quality==='high';
      const coverSrc=state.cover?(hqMode?state.cover+'&hq=1':state.cover):'';
      if(coverSrc){rec.img.src=coverSrc;rec.img.style.display='';rec.ph.style.display='none';}
      else{rec.img.style.display='none';rec.ph.style.display='';}
    }else if(rec.type==='text'){
      const txt=textForBind(rec.bind,rec.layer.style);
      if(rec.full!==txt){
        rec.full=txt;
        rec.span.style.animation='';rec.inner.classList.remove('scroll');
        if(rec.outline&&!(rec.layer.style||{}).marquee)fitOutlined(rec,txt);else rec.tnode.data=txt;
        syncOutline(rec);
        if(rec.layer.style&&rec.layer.style.marquee)requestAnimationFrame(()=>requestAnimationFrame(()=>applyMarquee(rec)));
      }
    }else if(rec.type==='progress'){
      startProgressClock();
    }
  }
  applyAutoHide();
}

function applyDoc(dc){
  if(!dc||!dc.canvas)return;
  doc=dc;applyCanvas(dc.canvas);buildLayers(dc);renderData();syncAudioStream();
  setTimeout(()=>{for(const id in layerEls){const rec=layerEls[id];if(rec.type==='text')applyMarquee(rec);}},60);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const id in layerEls){const rec=layerEls[id];if(rec.outline){if(!(rec.layer.style||{}).marquee&&rec.full!=null)fitOutlined(rec,rec.full);syncOutline(rec);}}});
}

function updateState(s){
  if(s._configUpdate){applyDoc(s.config);return;}
  if(s._config)applyDoc(s._config);
  ['title','artist','album','cover','progress','duration','isPlaying'].forEach(f=>{if(f in s)state[f]=s[f];});
  if('progress' in s||'isPlaying' in s)noteProgress();
  if('cover' in s)sampleCover();
  const key=(state.title||'')+'|'+(state.artist||'');
  const newSong=trackKey!==null&&key!==trackKey&&!!state.title&&((doc&&doc.canvas&&doc.canvas.entranceOn)||'track')==='track';
  trackKey=key;
  if(doc&&doc.canvas&&doc.canvas.bg&&doc.canvas.bg.blurFromCover&&(doc.canvas.bg.blur||0)>0){
    const blur=document.getElementById('blur');
    blur.style.backgroundImage=state.cover?`url(${state.cover})`:'none';
    blur.style.opacity=state.cover?'1':'0';
  }
  renderData();
  if(newSong)restartEntrances();
}

// Editor live-preview channel: the editor postMessages the in-progress doc
// during drag so the preview updates without flooding the backend with POSTs.
window.addEventListener('message',function(e){
  if(!EDITOR||e.source!==window.parent)return;
  if(e.data&&e.data.__overlayDoc)applyDoc(e.data.__overlayDoc);
  else if(e.data&&e.data.__overlayReplay&&doc){REPLAY=true;try{buildLayers(doc);}finally{REPLAY=false;}renderData();}
});

function connect(){
  const es=new EventSource(API+'/overlay/stream');
  es.onmessage=e=>{try{updateState(JSON.parse(e.data));}catch(_){}};
  es.onerror=()=>{es.close();setTimeout(connect,3000);};
}
applyCoverPal();
if(STILL){Object.assign(state,{title:'Song Title',artist:'Artist',album:'Album',progress:66,duration:180,isPlaying:true});}
else{fetch(API+'/overlay/config').then(r=>r.json()).then(c=>{applyDoc(c);connect();}).catch(()=>connect());}
</script></body></html>
